<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dinner Plan</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:24px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.person-card{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
}

.person-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    font-weight:bold;
}

select,
input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.timestamp{
    margin-top:10px;
    font-size:12px;
    color:#666;
}

.button-container{
    text-align:center;
    margin-top:25px;
}

button{
    background:#0078d4;
    color:#fff;
    border:none;
    border-radius:6px;
    padding:12px 28px;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#status{
    margin-top:15px;
    font-weight:bold;
}

@media (max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>Dinner Admin</h2>

<div class="grid">

    <!-- Kathy -->

    <div class="person-card">

        <div class="person-title">
            Kathy
        </div>

        <label>Dinner Status</label>

        <select id="kathyDinner">
            <option>Yes</option>
            <option>No</option>
            <option>Other</option>
        </select>

        <div
            id="kathyOtherContainer"
            style="display:none;margin-top:10px;">

            <input
                id="kathyOther"
                placeholder="Please specify">

        </div>

        <label>Notification</label>

        <select id="kathyNotification">
            <option>No</option>
            <option>Yes</option>
        </select>

        <div
            id="kathyUpdated"
            class="timestamp">
        </div>

        <div
            id="kathyRefreshed"
            class="timestamp">
        </div>

    </div>

    <!-- Elaine -->

    <div class="person-card">

        <div class="person-title">
            Elaine
        </div>

        <label>Dinner Status</label>

        <select id="elaineDinner">
            <option>Yes</option>
            <option>No</option>
            <option>Other</option>
        </select>

        <div
            id="elaineOtherContainer"
            style="display:none;margin-top:10px;">

            <input
                id="elaineOther"
                placeholder="Please specify">

        </div>

        <label>Notification</label>

        <select id="elaineNotification">
            <option>No</option>
            <option>Yes</option>
        </select>

        <div
            id="elaineUpdated"
            class="timestamp">
        </div>

        <div
            id="elaineRefreshed"
            class="timestamp">
        </div>

    </div>

</div>

<div class="button-container">

    <button
        id="saveBtn"
        onclick="saveAll()">
        Save
    </button>

    <div id="status"></div>

</div>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxF3SC-VETyIgQzzlmYtZBFVsbL_RlbTYOLGXr_Uec0d8Gv9BOmv3XFxPTg9zLMY8Ut/exec";

let latestData = null;

/* ==========================
   Date Formatter
========================== */

function formatHKDateTime(date){

    return date
        .toLocaleString(
            "en-GB",
            {
                timeZone:"Asia/Hong_Kong",
                day:"numeric",
                month:"short",
                year:"numeric",
                hour:"numeric",
                minute:"2-digit",
                second:"2-digit",
                hour12:true
            }
        )
        .replace(",", "")

}

/* ==========================
   Load Latest Data
========================== */

async function loadData(){

    try{

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now()
            );

        latestData =
            await response.json();

        populatePerson(
            "kathy",
            latestData.kathy
        );

        populatePerson(
            "elaine",
            latestData.elaine
        );

        const refreshed =
            formatHKDateTime(
                new Date()
            );

        document.getElementById(
            "kathyRefreshed"
        ).innerHTML =
            "Last Refreshed: " +
            refreshed;

        document.getElementById(
            "elaineRefreshed"
        ).innerHTML =
            "Last Refreshed: " +
            refreshed;

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "status"
        ).innerHTML =
            "❌ Unable to load data";

    }

}

/* ==========================
   Populate Form
========================== */

function populatePerson(
    person,
    data
){

    if(!data){
        return;
    }

    const dinnerSelect =
        document.getElementById(
            person + "Dinner"
        );

    const notificationSelect =
        document.getElementById(
            person + "Notification"
        );

    const otherInput =
        document.getElementById(
            person + "Other"
        );

    const otherContainer =
        document.getElementById(
            person + "OtherContainer"
        );

    notificationSelect.value =
        data.notification;

    if(
        data.dinner === "Yes" ||
        data.dinner === "No"
    ){

        dinnerSelect.value =
            data.dinner;

        otherInput.value = "";

        otherContainer.style.display =
            "none";

    }
    else{

        dinnerSelect.value =
            "Other";

        otherInput.value =
            data.dinner;

        otherContainer.style.display =
            "block";

    }

    document.getElementById(
        person + "Updated"
    ).innerHTML =
        "Last Updated: " +
        (
            data.lastUpdated || "-"
        );

}

/* ==========================
   Other Field Logic
========================== */

["kathy","elaine"].forEach(person => {

    document
    .getElementById(
        person + "Dinner"
    )
    .addEventListener(
        "change",
        function(){

            document
            .getElementById(
                person +
                "OtherContainer"
            )
            .style.display =
                this.value === "Other"
                ? "block"
                : "none";

        }
    );

});

/* ==========================
   Save One Person
========================== */

async function savePerson(
    personName,
    prefix
){

    let dinner =
        document
        .getElementById(
            prefix + "Dinner"
        )
        .value;

    if(dinner === "Other"){

        dinner =
            document
            .getElementById(
                prefix + "Other"
            )
            .value
            .trim();

        if(!dinner){
            dinner = "Other";
        }
    }

    const notification =
        document
        .getElementById(
            prefix +
            "Notification"
        )
        .value;

    const url =
        `${API_URL}?action=update`
        + `&person=${encodeURIComponent(personName)}`
        + `&dinner=${encodeURIComponent(dinner)}`
        + `&notification=${encodeURIComponent(notification)}`;

    await fetch(url);

}

/* ==========================
   Save All
========================== */

async function saveAll(){

    const saveBtn =
        document.getElementById(
            "saveBtn"
        );

    try{

        saveBtn.disabled = true;
        saveBtn.innerHTML = "Saving...";

        document.getElementById(
            "status"
        ).innerHTML = "";

        await savePerson(
            "Kathy",
            "kathy"
        );

        await savePerson(
            "Elaine",
            "elaine"
        );

        await loadData();

        document.getElementById(
            "status"
        ).innerHTML =
            "✅ Saved successfully";

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "status"
        ).innerHTML =
            "❌ Save failed";

    }
    finally{

        saveBtn.disabled = false;
        saveBtn.innerHTML = "Save";

    }

}

/* ==========================
   Initial Load
========================== */

loadData();

</script>

</body>
</html>
